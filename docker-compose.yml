services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - PORT=8080
      - DATABASE_URL_GO=data/sikompen.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - PORT=3000
      - INTERNAL_API_URL=http://backend:8080/api
    depends_on:
      - backend
