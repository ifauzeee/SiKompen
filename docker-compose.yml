services:
  backend:
    container_name: sikompen_backend_main
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file: .env
    environment:
      - PORT=8080
    depends_on:
      - db
      - redis
    networks:
      - sikompen_net

  db:
    container_name: sikompen_db_main
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-sikompen}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - sikompen_net

  redis:
    container_name: sikompen_redis_main
    image: redis:alpine
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - sikompen_net

  frontend:
    container_name: sikompen_frontend_main
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - PORT=3000
      - INTERNAL_API_URL=http://backend:8080/api
    depends_on:
      - backend
    networks:
      - sikompen_net

networks:
  sikompen_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
